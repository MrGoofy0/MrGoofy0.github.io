<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlit Sucker Trap</title>
  <style>
    :root {
      --bg-1: #0a1120;
      --bg-2: #101f34;
      --bg-3: #1b2d4a;
      --gold: #ffd166;
      --amber: #ff9f1c;
      --ruby: #ff4d6d;
      --mint: #7ef7d0;
      --sky: #dfeeff;
      --stall: #3b2b47;
      --stall-2: #553d63;
      --street: #1a1b28;
      --glass: rgba(255,255,255,0.38);
      --white: #f5f7ff;
      --shadow: rgba(0,0,0,0.32);
      --sub: rgba(10, 12, 18, 0.7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #070d15;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .video {
      position: relative;
      width: min(90vw, 420px);
      height: calc(90vw * 16 / 9);
      max-height: 92vh;
      overflow: hidden;
      background: linear-gradient(#0b1324, #111f35 36%, #1b2435 100%);
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255,255,255,0.1);
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(
        to bottom,
        #0a1020 0%,
        #172a42 28%,
        #1f364d 42%,
        #1b2732 59%,
        #111821 100%
      );
    }

    .sky-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,0.2), transparent 26%);
      animation: skyPulse 8s ease-in-out infinite alternate;
    }

    .moon {
      position: absolute;
      left: 66%;
      top: 8%;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffbe8, #d7e8ff 46%, #c8d7ff 70%, #b3c0e3 100%);
      box-shadow: 0 0 24px rgba(255,255,255,0.9), 0 0 60px rgba(150,190,255,0.5);
      transform: translateX(-50%);
      animation: moonFloat 10s ease-in-out infinite alternate;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(2px 2px at 20% 40%, rgba(255,255,255,0.7), transparent 100%),
        radial-gradient(2.5px 2.5px at 30% 15%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(2px 2px at 42% 28%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(1.5px 1.5px at 52% 18%, rgba(255,255,255,0.7), transparent 100%),
        radial-gradient(2px 2px at 66% 12%, rgba(255,255,255,0.6), transparent 100%),
        radial-gradient(1.8px 1.8px at 75% 31%, rgba(255,255,255,0.7), transparent 100%),
        radial-gradient(2px 2px at 88% 24%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(2px 2px at 92% 14%, rgba(255,255,255,0.7), transparent 100%);
      opacity: 0.9;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .city {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 38%;
      height: 26%;
      background:
        linear-gradient(to top, rgba(16,17,31,0.86), rgba(16,17,31,0.2)),
        repeating-linear-gradient(90deg,
          rgba(20,28,40,0.9) 0 24px,
          rgba(29,39,52,0.9) 24px 48px,
          rgba(23,27,38,1) 48px 72px
        );
      box-shadow: inset 0 20px 30px rgba(0,0,0,0.25);
    }

    .city::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,
          transparent 0 8%,
          rgba(255,255,255,0.05) 8% 10%,
          transparent 10% 14%,
          rgba(255,255,255,0.04) 14% 16%,
          transparent 16% 100%
        );
      opacity: 0.7;
    }

    .building {
      position: absolute;
      bottom: 0;
      width: 12%;
      background: linear-gradient(to top, rgba(12,17,26,0.9), rgba(22,32,45,0.8));
      border-radius: 8px 8px 0 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .building::before {
      content: "";
      position: absolute;
      inset: 8px 10% 12px;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.08) 0 4px, transparent 4px 8px);
      opacity: 0.8;
    }

    .street {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38%;
      background:
        linear-gradient(to bottom, rgba(39,49,62,0.5), rgba(15,17,23,1)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.06) 0 2px,
          transparent 2px 16px
        );
    }

    .street::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 24%;
      height: 1px;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 -14px 0 rgba(255,255,255,0.08), 0 -28px 0 rgba(255,255,255,0.06);
    }

    .stall {
      position: absolute;
      left: 47%;
      bottom: 21%;
      width: 46%;
      height: 32%;
      transform: translateX(-50%);
      z-index: 4;
    }

    .stall-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 24%;
      background: linear-gradient(180deg, var(--stall-2), var(--stall));
      border-radius: 18px 18px 12px 12px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }

    .stall-body {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 78%;
      background: linear-gradient(180deg, rgba(72,54,82,0.85), rgba(46,35,52,0.92));
      border-radius: 12px 12px 0 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .stall-body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.07) 0 14%, transparent 14% 18%, rgba(255,255,255,0.05) 18% 32%, transparent 32% 100%);
      opacity: 0.8;
    }

    .stall-sign {
      position: absolute;
      left: 18%;
      right: 18%;
      top: 32%;
      height: 16%;
      background: linear-gradient(180deg, #ffd673, #ffb347);
      border-radius: 30px;
      box-shadow: inset 0 0 0 2px rgba(104,66,0,0.28);
      transform: rotate(-2deg);
    }

    .stall-sign::before {
      content: "স্বপ্নের আয়না";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 700;
      color: rgba(50,22,0,0.8);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .glass-rack {
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 6%;
      height: 46%;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(200,235,255,0.15));
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
      transform: perspective(300px) rotateX(8deg);
    }

    .glass-rack::before,
    .glass-rack::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 18%;
      height: 70%;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(168,215,255,0.15));
      border-radius: 12px 12px 0 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .glass-rack::before { left: 8%; }
    .glass-rack::after { right: 8%; }

    .jewel {
      position: absolute;
      left: 49%;
      bottom: 62%;
      width: 24px;
      height: 24px;
      border-radius: 50% 50% 56% 50%;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #fff0b4, #ff8ec8 22%, #7ef4ff 42%, #9e8cff 100%);
      box-shadow: 0 0 20px rgba(163,221,255,0.9), 0 0 34px rgba(255,162,215,0.75);
      z-index: 8;
      animation: gemShine 1.8s ease-in-out infinite alternate;
    }

    .jewel::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }

    .character {
      position: absolute;
      width: 90px;
      height: 150px;
      z-index: 10;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.28));
      transition: transform 1.2s ease;
    }

    .head,
    .body,
    .arm,
    .leg,
    .hat,
    .eye,
    .shine,
    .belt,
    .tail {
      position: absolute;
      display: block;
    }

    .head {
      left: 50%;
      top: 0;
      width: 40px;
      height: 42px;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .body {
      left: 50%;
      top: 34px;
      width: 46px;
      height: 58px;
      border-radius: 18px 18px 12px 12px;
      transform: translateX(-50%);
    }

    .arm {
      width: 12px;
      height: 52px;
      border-radius: 12px;
      top: 42px;
    }

    .arm.left { left: 18px; transform: rotate(26deg); }
    .arm.right { right: 18px; transform: rotate(-26deg); }

    .leg {
      width: 13px;
      height: 52px;
      top: 88px;
      border-radius: 14px;
    }

    .leg.left { left: 33px; }
    .leg.right { right: 33px; }

    .eye {
      width: 5px;
      height: 5px;
      background: #1e2430;
      border-radius: 50%;
      top: 16px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
    }

    .eye.left { left: 14px; }
    .eye.right { right: 14px; }

    .shine {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      top: 4px;
      left: 10px;
      filter: blur(2px);
    }

    .protagonist {
      left: 16%;
      bottom: 7%;
      animation: lazyBob 2.7s ease-in-out infinite alternate;
    }

    .protagonist .head {
      background: linear-gradient(180deg, #f3c59a, #dca778);
      box-shadow: inset -4px -6px 0 rgba(120,86,60,0.12);
    }
    .protagonist .body {
      background: linear-gradient(180deg, #7ae8c0, #42b28d);
      border: 2px solid rgba(0,0,0,0.08);
    }
    .protagonist .arm { background: #d8a070; }
    .protagonist .leg { background: #32506f; }
    .protagonist .hat {
      width: 54px; height: 18px; left: 50%; top: -8px; transform: translateX(-50%);
      background: linear-gradient(180deg, #cdb5a1, #a68b70);
      border-radius: 30px 30px 18px 18px;
      box-shadow: inset 0 -4px 0 rgba(83,54,30,0.15);
    }

    .protagonist .belt {
      position: absolute;
      left: 50%; top: 64px; width: 44px; height: 8px; transform: translateX(-50%);
      background: rgba(62,60,95,0.45);
      border-radius: 8px;
    }

    .protagonist .tail {
      position: absolute;
      left: 56px; top: 62px; width: 18px; height: 40px; border-radius: 50%;
      background: linear-gradient(180deg, #7ce8c3, #54b78f);
      transform: rotate(18deg);
      opacity: 0.8;
    }

    .protagonist .leg.left { transform: rotate(8deg); }
    .protagonist .leg.right { transform: rotate(-8deg); }

    .protagonist .shoe {
      position: absolute;
      bottom: -4px;
      width: 22px; height: 12px;
      background: #302d3d;
      border-radius: 16px;
    }
    .protagonist .shoe.left { left: 28px; }
    .protagonist .shoe.right { right: 28px; }

    .antagonist {
      left: 70%;
      bottom: 7%;
      animation: stalk 2.2s ease-in-out infinite alternate;
    }

    .antagonist .head {
      background: linear-gradient(180deg, #e9b28a, #c98a5c);
      border: 2px solid rgba(78,48,20,0.1);
    }
    .antagonist .body {
      background: linear-gradient(180deg, #f7d38b, #d38d5b);
      border: 2px solid rgba(70,37,11,0.12);
    }
    .antagonist .arm { background: #d98f5c; }
    .antagonist .leg { background: #3d2f2f; }
    .antagonist .hat {
      position: absolute;
      left: 50%;
      top: -10px;
      width: 52px;
      height: 20px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #5e3b29, #2d1e18);
      border-radius: 24px 24px 8px 8px;
      box-shadow: inset 0 -4px 0 rgba(255,255,255,0.08);
    }
    .antagonist .hat::before {
      content: "";
      position: absolute;
      left: 50%; top: -8px;
      width: 16px; height: 12px; transform: translateX(-50%);
      background: #b25340; border-radius: 10px 10px 0 0;
    }
    .antagonist .body::before {
      content: "";
      position: absolute;
      inset: 8px 12px auto;
      height: 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
    }

    .helper {
      left: 58%;
      bottom: 26%;
      width: 72px;
      height: 120px;
      animation: helperHop 1.8s ease-in-out infinite alternate;
      z-index: 12;
    }

    .helper .head {
      background: linear-gradient(180deg, #7fc4ff, #4da5eb);
      width: 30px;
      height: 30px;
    }
    .helper .body {
      background: linear-gradient(180deg, #d1f3ff, #8dd6df);
      width: 34px; height: 42px;
      border-radius: 14px 14px 10px 10px;
    }
    .helper .arm { background: #7eabff; }
    .helper .leg { background: #3c4f99; }
    .helper .tail {
      position: absolute;
      width: 16px; height: 32px;
      background: linear-gradient(180deg, #a9edff, #89c3ff);
      right: 8px; top: 30px;
      border-radius: 50%;
      transform: rotate(30deg);
    }
    .helper .hat {
      position: absolute;
      left: 50%; top: -6px;
      width: 30px; height: 12px;
      transform: translateX(-50%);
      background: #6d5bd2; border-radius: 12px 12px 4px 4px;
    }

    .net {
      position: absolute;
      left: 52%;
      bottom: 14%;
      width: 130px;
      height: 76px;
      background:
        linear-gradient(transparent 0 72%, rgba(244,252,255,0.9) 72% 100%),
        repeating-linear-gradient(90deg, transparent 0 10px, rgba(140,200,225,0.75) 10px 11px),
        repeating-linear-gradient(0deg, transparent 0 10px, rgba(132,170,195,0.8) 10px 11px);
      border-radius: 18px 18px 36px 36px;
      opacity: 0;
      z-index: 5;
      transform: rotate(-2deg) scale(0.4);
      transition: all 1.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
    }

    .net.visible {
      opacity: 1;
      transform: rotate(-2deg) scale(1);
    }

    .flash {
      position: absolute;
      left: 52%;
      bottom: 50%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.45), rgba(255,255,255,0.18) 24%, transparent 54%);
      opacity: 0;
      transform: translate(-50%, 50%) scale(0.4);
      transition: all 0.8s ease;
      z-index: 6;
      pointer-events: none;
    }

    .flash.active {
      opacity: 1;
      transform: translate(-50%, 50%) scale(1.4);
    }

    .subtitle-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2%;
      z-index: 999;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .subtitle {
      min-height: 92px;
      width: min(88%, 360px);
      background: rgba(10, 14, 18, 0.72);
      backdrop-filter: blur(3px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px 14px 10px;
      color: var(--white);
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 18px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .subtitle.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes skyPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    @keyframes moonFloat {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      100% { transform: translateX(-50%) translateY(-6px) scale(1.02); }
    }

    @keyframes twinkle {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @keyframes lazyBob {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-10px) rotate(3deg); }
    }

    @keyframes stalk {
      0% { transform: translateY(0) rotate(2deg); }
      100% { transform: translateY(-8px) rotate(-3deg); }
    }

    @keyframes helperHop {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-7px) scale(1.04); }
    }

    @keyframes gemShine {
      0% { filter: brightness(1); box-shadow: 0 0 14px rgba(163,221,255,0.8), 0 0 26px rgba(255,162,215,0.7); }
      100% { filter: brightness(1.28); box-shadow: 0 0 22px rgba(163,221,255,1), 0 0 44px rgba(255,162,215,0.9); }
    }

    @media (max-width: 420px) {
      .video {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
      .subtitle {
        width: 92%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="video" id="video">
    <div class="scene">
      <div class="sky-glow"></div>
      <div class="stars"></div>
      <div class="moon"></div>

      <div class="city" id="city"></div>

      <div class="stall">
        <div class="stall-top"></div>
        <div class="stall-body">
          <div class="stall-sign"></div>
          <div class="glass-rack"></div>
        </div>
      </div>

      <div class="jewel"></div>
      <div class="net" id="net"></div>
      <div class="flash" id="flash"></div>

      <div class="character protagonist" id="protagonist">
        <div class="hat"></div>
        <div class="head">
          <div class="shine"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
        <div class="body">
          <div class="belt"></div>
        </div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="shoe left"></div>
        <div class="shoe right"></div>
        <div class="tail"></div>
      </div>

      <div class="character helper" id="helper">
        <div class="hat"></div>
        <div class="head">
          <div class="shine"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="tail"></div>
      </div>

      <div class="character antagonist" id="antagonist">
        <div class="hat"></div>
        <div class="head">
          <div class="shine"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="street"></div>
    </div>

    <div class="subtitle-wrap">
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>

  <script>
    const city = document.getElementById('city');
    const subtitle = document.getElementById('subtitle');
    const protagonist = document.getElementById('protagonist');
    const antagonist = document.getElementById('antagonist');
    const helper = document.getElementById('helper');
    const net = document.getElementById('net');
    const flash = document.getElementById('flash');

    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'building';
      b.style.left = `${i * 9}%`;
      b.style.height = (30 + (i * 11) % 50) + '%';
      b.style.width = (7 + (i % 3) * 3) + '%';
      city.appendChild(b);
    }

    const subtitles = [
      { start: 0, end: 3.8, text: "ভেজা রাতের বাজারে, ভুলু নামের একজন ভাঙা কাঁচের বিক্রেতা কুঁদিয়ে ধুঁধিয়ে চলে।" },
      { start: 3.8, end: 7.5, text: "সে বোকা সাজে হাঁটে, কিন্তু তার চোখে লুকিয়ে থাকে একরাশ চালাকির আলো।" },
      { start: 7.5, end: 11.1, text: "অন্যদিকে, রতন নামে এক ছদ্মবেশী চোর শহরের রত্নের টাকায় নুন্যতম হাসি নিয়ে ঘুরে বেড়ায়।" },
      { start: 11.1, end: 14.7, text: "রতন ভুলুকে সহজ শিকার ভেবে তার সামনেই গোপনে রত্নের পেটিকা দেখিয়ে দেয়।" },
      { start: 14.7, end: 18.7, text: "ভুলু এক পা পিছিয়ে, এক পা এগিয়ে, মেঝেতে কাঁচি ছুঁড়ে ফেলে চোরের দৃষ্টি টেনে নেয়।" },
      { start: 18.7, end: 22.1, text: "চোরের লোভ জ্বলে ওঠে—ভুলু এতই নির্লজ্জ, এতই বোকা, যে সে তার মগজে ঢুকে যায়।" },
      { start: 22.1, end: 25.4, text: "তখনই ভুলুর ছোট্ট সহকারী নীলু ছাদের উপর চুপচাপ আয়নার ধাঁধাঁ সাজিয়ে দেয়।" },
      { start: 25.4, end: 29.4, text: "একটা ভেজাল সোনার রত্ন জ্বলে ওঠে; রতন তার দৃষ্টি ধরে ফেলতে পারে না।" },
      { start: 29.4, end: 33.1, text: "ভুলু ভাঁজ করা কাঁধ নিয়ে ঘুরে দাঁড়ায়, যেন কিছুই বোঝে না—কিন্তু তার মুখে লুকিয়ে is a plan." },
      { start: 33.1, end: 37.2, text: "রতন লোভে পড়ে সামনে এগোতে থাকে, ভুলুর “বোকামি”কে সত্যি ভেবে নিয়ে।" },
      { start: 37.2, end: 41.1, text: "হঠাৎ আয়না-ফাঁদের আলো জ্বলে ওঠে; ছাদ থেকে ভেসে আসে এক ভেজা ঝলকানি।" },
      { start: 41.1, end: 45.4, text: "ভুলু কীভাবে কাপুরুষের মতো নেমে আসে, তা মনে হয় এমনই—কিন্তু সে আসলে ফাঁদকে সাজিয়ে রেখেছে।" },
      { start: 45.4, end: 49.1, text: "রতন নিজের লোভেই পা বাড়ায়; জাল ভিজে ওঠে, তার শরীর আটকে যায় আয়নার কাঁধে।" },
      { start: 49.1, end: 53.5, text: "নীলু হাসি চেপে রাখে, আর ভুলু নীরবে ছাদের ওপর দাঁড়ায়—যেন কিছুই ঘটেনি।" },
      { start: 53.5, end: 57.7, text: "মর্মরানো আলোয়, ভেজা বাজারের ভেতর একটাই সত্য দেখা যায়: ঠকতে চেয়েছিল, সে-ই ঠকেছে।" },
      { start: 57.7, end: 62.5, text: "ভুলু নিজেকে ছোট করে সাজিয়ে, চোরের লোভকে হাতিয়ার বানিয়ে নিজের শত্রুকে ফাঁদে ফেলেছে।" },
      { start: 62.5, end: 68.0, text: "সত্যি বললে, বোকা সাজে বোকা ধরানোই ছিল সবচেয়ে নরম, সবচেয়ে সাহসী কৌশল।" }
    ];

    function setSubtitle(text) {
      subtitle.textContent = text;
      subtitle.classList.remove('show');
      void subtitle.offsetWidth;
      subtitle.classList.add('show');
    }

    function updateScene(time) {
      if (time < 8) {
        protagonist.style.left = '15%';
        protagonist.style.bottom = '7%';
        antagonist.style.left = '69%';
        antagonist.style.bottom = '7%';
        helper.style.left = '58%';
        helper.style.bottom = '25%';
        net.classList.remove('visible');
        flash.classList.remove('active');
      } else if (time < 24) {
        protagonist.style.left = '17%';
        protagonist.style.bottom = '8%';
        antagonist.style.left = '64%';
        antagonist.style.bottom = '7%';
        helper.style.left = '58%';
        helper.style.bottom = '25%';
        net.classList.remove('visible');
        flash.classList.remove('active');
      } else if (time < 42) {
        protagonist.style.left = '30%';
        protagonist.style.bottom = '17%';
        antagonist.style.left = '59%';
        antagonist.style.bottom = '13%';
        helper.style.left = '61%';
        helper.style.bottom = '26%';
        flash.classList.add('active');
      } else if (time < 56) {
        protagonist.style.left = '32%';
        protagonist.style.bottom = '18%';
        antagonist.style.left = '57%';
        antagonist.style.bottom = '11%';
        helper.style.left = '63%';
        helper.style.bottom = '27%';
        net.classList.add('visible');
        flash.classList.add('active');
      } else {
        protagonist.style.left = '35%';
        protagonist.style.bottom = '12%';
        antagonist.style.left = '53%';
        antagonist.style.bottom = '14%';
        helper.style.left = '62%';
        helper.style.bottom = '26%';
        net.classList.add('visible');
        flash.classList.add('active');
      }
    }

    const start = performance.now();
    let lastIdx = -1;

    function tick() {
      const t = (performance.now() - start) / 1000;
      updateScene(t);

      for (let i = 0; i < subtitles.length; i++) {
        const s = subtitles[i];
        if (t >= s.start && t < s.end) {
          if (lastIdx !== i) {
            setSubtitle(s.text);
            lastIdx = i;
          }
          break;
        }
      }

      if (t < 68) {
        requestAnimationFrame(tick);
      } else {
        subtitle.style.opacity = '0.96';
      }
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>

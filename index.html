<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advertisement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 15px;
      text-align: center;
    }

    .ad-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .ad-box {
      background: #fff;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 35px;
      overflow: hidden;
    }

    .ad-728x90 {
      width: 728px;
      height: 90px;
      max-width: 100%;
    }

    .ad-300x250 {
      width: 300px;
      height: 250px;
    }

    .ad-160x600 {
      width: 160px;
      height: 600px;
    }

    .ad-970x250 {
      width: 970px;
      height: 250px;
      max-width: 100%;
    }

    @media (max-width: 760px) {
      .ad-728x90 {
        width: 100%;
        height: auto;
        aspect-ratio: 728 / 90;
      }

      .ad-970x250 {
        width: 100%;
        height: auto;
        aspect-ratio: 970 / 250;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- 728x90 Advertisement -->
    <div class="ad-label">Advertisement</div>
    <div class="ad-box ad-728x90">
      <script async
        src="https://ad2coin.com/s/w.js"
        data-unit-id="cmupixoud006110mev973iyaj"
        data-width="728"
        data-height="90">
      </script>
    </div>

    <!-- 300x250 Advertisement -->
    <div class="ad-label">Advertisement</div>
    <div class="ad-box ad-300x250">
      <script async
        src="https://ad2coin.com/s/w.js"
        data-unit-id="cmupiyw36006510me4fwsrh3o"
        data-width="300"
        data-height="250">
      </script>
    </div>

    <!-- 160x600 Advertisement -->
    <div class="ad-label">Advertisement</div>
    <div class="ad-box ad-160x600">
      <script async
        src="https://ad2coin.com/s/w.js"
        data-unit-id="cmupj16lx006710mewlz7xg68"
        data-width="160"
        data-height="600">
      </script>
    </div>

    <!-- 970x250 Advertisement -->
    <div class="ad-label">Advertisement</div>
    <div class="ad-box ad-970x250">
      <script async
        src="https://ad2coin.com/s/w.js"
        data-unit-id="cmupjmai0007h10meh8hugcfb"
        data-width="970"
        data-height="250">
      </script>
    </div>

  </main>

</body>
</html>
